<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تأكيد البريد الإلكتروني</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:Arial,sans-serif;direction:rtl;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:28px;">
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background:linear-gradient(135deg,#14b8a6,#0d9488);border-radius:14px;width:52px;height:52px;text-align:center;vertical-align:middle;">
                    <span style="color:#ffffff;font-size:24px;font-weight:bold;line-height:52px;">ع</span>
                  </td>
                  <td style="padding-right:12px;vertical-align:middle;">
                    <div style="font-size:18px;font-weight:bold;color:#0f172a;">عقارات جرمانا</div>
                    <div style="font-size:12px;color:#0d9488;">Real Estate</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background:#ffffff;border-radius:20px;padding:40px 36px;box-shadow:0 4px 24px rgba(0,0,0,0.07);">

              <!-- Icon -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding-bottom:24px;">
                    <div style="width:64px;height:64px;background:#f0fdf4;border-radius:50%;text-align:center;line-height:64px;font-size:28px;">✉️</div>
                  </td>
                </tr>
              </table>

              <h1 style="margin:0 0 12px;font-size:22px;font-weight:bold;color:#0f172a;text-align:center;">
                تأكيد بريدك الإلكتروني
              </h1>
              <p style="margin:0 0 28px;font-size:15px;color:#64748b;text-align:center;line-height:1.7;">
                شكراً لتسجيلك في عقارات جرمانا!<br/>
                اضغط على الزر أدناه لتفعيل حسابك.
              </p>

              <!-- Button -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding-bottom:28px;">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;background-color:#0d9488;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;padding:14px 40px;border-radius:12px;">
                      تفعيل الحساب
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 8px;font-size:13px;color:#94a3b8;text-align:center;">
                الرابط صالح لمدة 24 ساعة
              </p>
              <p style="margin:0;font-size:12px;color:#cbd5e1;text-align:center;">
                إذا لم تقم بإنشاء هذا الحساب، يمكنك تجاهل هذا الإيميل.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0;font-size:12px;color:#94a3b8;">
                © 2025 عقارات جرمانا — جرمانا، دمشق، سوريا
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
